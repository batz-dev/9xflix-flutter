name: Build Android APK & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK for Release
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/FlixDirect-v1.0.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlixDirect-Release-APK
          path: build/app/outputs/flutter-apk/FlixDirect-v1.0.4.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "FlixDirect Mobile v1.0.4"
          body: |
            ### 🎬 FlixDirect v1.0.4 Update
            - **Direct Video Stream on Gofile & All Mirrors:** Clicking Download on Gofile or any mirror row triggers instant direct file download without redirecting to landing pages.
            - **PixelDrain Direct API Integration:** Instant 10Gbps stream resolution fallback for movies when R2 sync is pending.
            - **Fresh Link Bypassing:** Real-time stream resolution ensures all download links are fresh and active.
            - **Cloudflare R2 Direct Worker Priority:** Guarantees instant 0-wait downloads for Deadpool 2, Deadpool & Wolverine, Mirzapur, etc.
          files: |
            build/app/outputs/flutter-apk/FlixDirect-v1.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
