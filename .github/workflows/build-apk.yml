name: Build Android APK & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK for Release
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/FlixDirect-v1.0.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlixDirect-Release-APK
          path: build/app/outputs/flutter-apk/FlixDirect-v1.0.2.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "FlixDirect Mobile v1.0.2"
          body: |
            ### 🎬 FlixDirect v1.0.2 Update
            - **Instant Direct Download on Mirror Click:** Clicking Gofile, R2, or any mirror link in the bottom sheet directly starts downloading the actual `.mkv` movie file.
            - **Gofile Streaming & Resolver:** Direct stream support prevents downloading invalid HTML landing pages or getting 404 errors.
            - **High-Speed CDN Fallback:** If any host is busy or rate-limited, automatically falls back to 10Gbps Cloudflare R2 worker CDN so downloads never fail.
            - **Browser Launcher:** Clean external browser option next to each mirror for manual verification.
            - **Fixed Missing Images & Bypasses:** Universal image proxying and Desilinks multi-tier unpacking.
          files: |
            build/app/outputs/flutter-apk/FlixDirect-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
